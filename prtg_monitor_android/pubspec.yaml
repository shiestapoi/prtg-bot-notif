name: prtg_monitor
description: PRTG Network Monitor - Android background monitoring with alarm notifications
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP client
  http: ^1.2.1
  # Local storage
  shared_preferences: ^2.2.3
  # Local notifications (pinned)
  flutter_local_notifications: ^17.2.3
  # Audio player for alarm
  audioplayers: ^6.1.0
  # State management
  provider: ^6.1.2
  # JSON serialization
  json_annotation: ^4.9.0
  # Timezone
  intl: ^0.19.0
  # Permission handler
  permission_handler: ^11.3.1
  # Wakelock (keep CPU alive in background)
  wakelock_plus: ^1.2.8
  # File picker for custom alarm sounds
  file_picker: ^8.1.6
  # Path provider for app storage
  path_provider: ^2.1.5
  # Vibration for alarm haptic feedback
  vibration: ^2.0.0
  # Interactive image viewer for chart zoom
  photo_view: ^0.15.0
  # Secure storage for credentials
  flutter_secure_storage: ^9.2.4
  # Image caching
  cached_network_image: ^3.4.1
  # Share functionality
  share_plus: ^10.1.4
  # Local auth (biometric/PIN)
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
